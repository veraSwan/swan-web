<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- dark rounded background -->
  <rect width="100" height="100" rx="22" fill="#0E1016"/>

  <!-- body -->
  <ellipse cx="44" cy="76" rx="27" ry="15" fill="#C05775" transform="rotate(-8 44 76)"/>

  <!-- neck — thick S-curve stroke blending body → head -->
  <path d="M 34,63 C 26,50 60,44 63,26"
        stroke="#C05775" stroke-width="19" stroke-linecap="round" fill="none"/>

  <!-- head -->
  <circle cx="65" cy="20" r="12" fill="#C05775"/>

  <!-- beak -->
  <ellipse cx="78" cy="19" rx="9" ry="4.5" fill="#C05775"/>

  <!-- eye -->
  <circle cx="69" cy="16" r="2.2" fill="#0E1016"/>
</svg>
